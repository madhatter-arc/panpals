name: Update news feeds

on:
  schedule:
    - cron: "23 2 * * *"   # every night at 02:23 UTC
  workflow_dispatch:          # "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/update_feeds.py
      - name: Commit if changed
        run: |
          git config user.name "panpals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/feeds.js data/articles assets/news/auto || true
          git diff --cached --quiet || (git commit -m "Update news feeds" && git push)